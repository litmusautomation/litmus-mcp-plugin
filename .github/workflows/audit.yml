name: audit

# Offline consistency checks. Nothing here clones or contacts
# litmus-mcp-server, so these run on any fork or PR with no secrets.
#
# What is deliberately NOT here: comparing the vendored src/ tree against
# upstream. That needs an upstream checkout, and the plugin is a deliberate pin,
# so being behind upstream is a normal state rather than a build failure. Run
# ./scripts/check-source-drift.sh by hand when syncing or before a release.
#
# What these catch is the failure that actually shipped once: commands, skills,
# and agents naming tools that do not exist in the vendored source, and docs
# naming litmus-cli commands that do not exist in the binary.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tool-names:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Every tool name in commands, skills, and agents exists in src/
        run: |
          # Prompt-side assets hardcode tool names, so they go stale whenever the
          # vendored surface changes. Only names written inside backticks count,
          # so ordinary prose that happens to match the pattern is ignored.
          grep -rhoE '\b(get|list|create|update|delete|set|start|stop|query|run|lem|litmus)_[a-z_]+\b' \
            commands/ skills/ agents/ | sort -u > /tmp/referenced.txt
          grep -rhoE '"name": "[a-z_]+"' src/tools/*.py \
            | sed 's/.*: "//;s/"//' | sort -u > /tmp/actual.txt

          echo "Vendored tools: $(wc -l < /tmp/actual.txt)"

          fail=0
          while read -r name; do
            grep -qxF "$name" /tmp/actual.txt && continue
            if grep -rqF "\`$name\`" commands/ skills/ agents/; then
              echo "::error::\`$name\` is referenced in commands/skills/agents but is not a tool in src/"
              fail=1
            fi
          done < /tmp/referenced.txt

          [ "$fail" -eq 0 ] && echo "All referenced tool names exist in src/."
          exit "$fail"

      - name: Plugin and marketplace manifests are valid
        run: |
          # Version drift between the two manifests is a release footgun: the
          # README requires bumping them together.
          claude_v="$(sed -n 's/.*"version": "\(.*\)".*/\1/p' .claude-plugin/plugin.json | head -1)"
          codex_v="$(sed -n 's/.*"version": "\(.*\)".*/\1/p' plugins/litmus-mcp/.codex-plugin/plugin.json | head -1)"
          echo "claude=$claude_v codex=$codex_v"
          if [ "$claude_v" != "$codex_v" ]; then
            echo "::error::Manifest versions differ ($claude_v vs $codex_v). Bump both together."
            exit 1
          fi
          for f in .claude-plugin/plugin.json .claude-plugin/marketplace.json \
                   plugins/litmus-mcp/.codex-plugin/plugin.json plugins/litmus-mcp/.mcp.json \
                   mcp/claude.mcp.json hooks/claude.hooks.json .agents/plugins/marketplace.json; do
            python3 -c "import json,sys; json.load(open('$f'))" || { echo "::error::$f is not valid JSON"; exit 1; }
            echo "  ok $f"
          done

  cli-commands:
    runs-on: ubuntu-latest
    # Needs a network fetch of the binary, so a failure here should not block a
    # docs-only PR. The tool-names job above is the hard gate.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install litmus-cli
        run: |
          ./scripts/install-cli.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Every documented litmus-cli command exists in the binary
        run: |
          litmus-cli --version

          subcommands() {
            litmus-cli $1 --help 2>&1 \
              | sed -n '/^Available Commands:/,/^Flags:/p' \
              | awk 'NF>1 && $1!~/^(Available|Flags:)/ {print $1}'
          }
          {
            subcommands ""          | sed 's|^|litmus-cli |'
            subcommands "le"        | sed 's|^|litmus-cli le |'
            subcommands "lem"       | sed 's|^|litmus-cli lem |'
            subcommands "le data"   | sed 's|^|litmus-cli le data |'
            subcommands "config"    | sed 's|^|litmus-cli config |'
          } | sort -u > /tmp/cli-real.txt

          grep -rhoE 'litmus-cli (le data [a-z-]+|le [a-z-]+|lem [a-z-]+|config [a-z-]+|list|run|login|update|version)' \
            commands/ skills/ agents/ README.md scripts/ | sort -u > /tmp/cli-doc.txt

          fail=0
          while read -r cmd; do
            grep -qxF "$cmd" /tmp/cli-real.txt \
              || { echo "::error::'$cmd' is documented but is not a litmus-cli command"; fail=1; }
          done < /tmp/cli-doc.txt

          [ "$fail" -eq 0 ] && echo "All $(wc -l < /tmp/cli-doc.txt) documented commands exist in $(litmus-cli --version | head -1)."
          exit "$fail"
